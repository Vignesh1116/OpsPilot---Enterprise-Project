version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: opspilot_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opspilot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opspilot_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-opspilot_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot_user -d opspilot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: opspilot_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opspilot_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://opspilot_user:opspilot_secure_password@db:5432/opspilot_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - SECRET_KEY=${SECRET_KEY:-opspilot-enterprise-super-secret-key-change-in-production-min32bytes}
      - ENVIRONMENT=production
      - DEBUG=false
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: opspilot_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
  redisdata:
